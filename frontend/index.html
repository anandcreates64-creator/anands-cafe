<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body{ background:#0E0E0E; color:white; font-family:'Nunito', sans-serif; padding:20px; }
    
    .bento{
      display:grid;
      gap:20px;
      grid-template-columns: 1fr;
    }
    @media(min-width:800px){
      .bento{ grid-template-columns: repeat(3, 1fr); }
    }

    .clay-card{
      background:#FFF8F0;
      border:4px solid #111;
      border-radius:28px;
      padding:24px;
      color:#111;
      box-shadow: 
        8px 8px 0px #111,
        inset 6px 6px 12px rgba(255,255,255,0.9),
        inset -6px -6px 12px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    .clay-card:hover{
      transform: translate(-4px, -4px) scale(1.02);
      box-shadow: 
        12px 12px 0px #111,
        inset 6px 6px 12px rgba(255,255,255,0.9);
    }
    
    /* Pastel colors */
    .c1{ background:#FFD6A7; }
    .c2{ background:#B5EAD7; }
    .c3{ background:#FFDAC1; }
    .c4{ background:#E2F0CB; }

   .menu-item{
  transition: all 0.15s ease;
  cursor: pointer;
}
.menu-item:hover{
  transform: translate(-2px, -2px) scale(1.03);
  box-shadow: 4px 4px 0px #111;
  background: #FFF8F0 !important;
}
.menu-item:active{
  transform: translate(0px, 0px) scale(0.98);
  box-shadow: 1px 1px 0px #111;
}
  </style>
</head>
<body>
  <h1>Anand's Cafe - Day 2</h1>
  <div class="bento">
    <div class="clay-card c1" style="grid-row: span 2;">
      <h2>☕ Signature Coffee</h2>
      <p>Strong & Smooth</p>
    </div>
    <div class="clay-card c2">
  <h3>📜 Menu</h3>
  <div style="margin-top:16px; display:flex; flex-direction:column; gap:12px;">
    
    <div style="display:flex; justify-content:space-between; background:white; border:3px solid #111; border-radius:16px; padding:10px 14px;" class="menu-item">
      <span>Espresso</span> <b>₹120</b>
    </div>
    
    <div style="display:flex; justify-content:space-between; background:white; border:3px solid #111; border-radius:16px; padding:10px 14px;" class="menu-item">
      <span>Cappuccino</span> <b>₹180</b>
    </div>
    
    <div style="display:flex; justify-content:space-between; background:white; border:3px solid #111; border-radius:16px; padding:10px 14px;" class="menu-item">
      <span>Cold Brew</span> <b>₹200</b>
    </div>
    
    <div style="display:flex; justify-content:space-between; background:white; border:3px solid #111; border-radius:16px; padding:10px 14px;" class="menu-item">
      <span>Croissant</span> <b>₹150</b>
    </div>

  </div>
</div>
    <div class="clay-card c3"><h3>About</h3></div>
    <div class="clay-card c4" style="grid-column: span 2;"><h3>Visit Us - Claymorphism Contact Card</h3></div>
  </div>
</body>
</html>
